<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Note — Try the Prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="js/webgazer.js" onerror="window._webgazerLoadFailed=1"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0e17;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      max-width: 800px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header h1 { font-size: 1.5rem; }
    .header a {
      color: #00d4aa;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .header a:hover { text-decoration: underline; }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #00d4aa; color: #0a0e17; }
    .btn-primary:hover { background: #00a884; }
    .btn-secondary { background: transparent; border: 1px solid #1e2733; color: #e6edf3; }
    .btn-secondary:hover { border-color: #8b949e; }
    .status {
      max-width: 800px;
      margin: 0 auto 16px;
      padding: 12px 16px;
      background: #131920;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #8b949e;
    }
    .status.active { color: #00d4aa; }
    #gazeDot {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00d4aa;
      border: 3px solid rgba(0,212,170,0.5);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><img src="logo.svg" alt="" width="28" height="28" style="vertical-align: middle; margin-right: 8px;"> Side Note — Gaze Tracking Demo</h1>
    <a href="index.html">← Back to overview</a>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn">Start tracking</button>
      <button class="btn btn-secondary" id="calibrateBtn" disabled>Calibrate</button>
      <button class="btn btn-secondary" id="stopBtn" disabled>Stop</button>
    </div>
  </div>
  <div class="status" id="status">Click "Start tracking" and allow camera access when prompted.</div>

  <div id="gazeDot"></div>

  <p style="max-width:800px;margin:0 auto;color:#8b949e;font-size:0.9rem;">
    After starting, look at the green dot — it follows your gaze. Click "Calibrate" and look at each point for better accuracy.
  </p>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const statusEl = document.getElementById('status');
    const gazeDot = document.getElementById('gazeDot');
    let tracking = false;

    function setStatus(msg, active) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('active', !!active);
    }

    var loadCheckCount = 0;
    function initWhenReady() {
      if (typeof webgazer !== 'undefined') {
        startBtn.disabled = false;
        setStatus('Click "Start tracking" and allow camera access when prompted.');
        return;
      }
      loadCheckCount++;
      if (loadCheckCount === 20 && !window._webgazerCDNFailed) {
        setStatus('Local script failed, loading from CDN...');
        var s = document.createElement('script');
        s.src = 'https://webgazer.cs.brown.edu/webgazer.js';
        s.crossOrigin = 'anonymous';
        s.onload = function() { setTimeout(initWhenReady, 100); };
        s.onerror = function() { window._webgazerCDNFailed = true; };
        document.head.appendChild(s);
        return;
      }
      if (loadCheckCount > 50) {
        setStatus('Eye-tracking library could not load. Use http://localhost (e.g. http://localhost:8000/demo.html) and allow camera.');
        return;
      }
      setStatus('Loading eye-tracking library...');
      setTimeout(initWhenReady, 200);
    }

    startBtn.onclick = function() {
      if (tracking) return;
      if (typeof webgazer === 'undefined') {
        setStatus('WebGazer not loaded yet. Please wait and try again.');
        return;
      }
      setStatus('Initializing camera...');
      gazeDot.style.display = 'block';
      gazeDot.style.left = '50%';
      gazeDot.style.top = '50%';
      try {
        webgazer.setGazeListener(function(data) {
          if (!tracking) return;
          if (data && typeof data.x === 'number' && typeof data.y === 'number') {
            gazeDot.style.left = Math.max(0, Math.min(data.x, window.innerWidth)) + 'px';
            gazeDot.style.top = Math.max(0, Math.min(data.y, window.innerHeight)) + 'px';
          }
        });
        var result = webgazer.begin();
        function whenReady() {
          if (typeof webgazer.showVideo === 'function') webgazer.showVideo(true);
          else if (typeof webgazer.showVideoPreview === 'function') webgazer.showVideoPreview(true);
          if (typeof webgazer.showPredictionPoints === 'function') webgazer.showPredictionPoints(true);
          tracking = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          calibrateBtn.disabled = false;
          setStatus('Tracking active — green dot follows your gaze. Look at the dot; calibrate when it appears.', true);
        }
        if (result && typeof result.then === 'function') {
          result.then(whenReady).catch(function(err) {
            setStatus('Camera error: ' + (err.message || err));
            gazeDot.style.display = 'none';
          });
        } else {
          whenReady();
        }
      } catch (err) {
        gazeDot.style.display = 'none';
        setStatus('Error: ' + (err.message || err));
        console.error(err);
      }
    };

    stopBtn.onclick = function() {
      if (!tracking) return;
      try {
        webgazer.end();
      } catch (e) {}
      tracking = false;
      gazeDot.style.display = 'none';
      startBtn.disabled = false;
      stopBtn.disabled = true;
      calibrateBtn.disabled = true;
      setStatus('Stopped. Click "Start tracking" to try again.');
    };

    calibrateBtn.onclick = function() {
      if (!tracking) return;
      try {
        if (typeof webgazer.showPredictionPoints === 'function') webgazer.showPredictionPoints(true);
        if (typeof webgazer.setRegression === 'function') webgazer.setRegression('ridge');
        calibrateBtn.disabled = true;
        setStatus('Look at each red dot as it appears. Calibration improves accuracy.', true);
        setTimeout(function() { calibrateBtn.disabled = false; }, 8000);
      } catch (e) {
        setStatus('Calibration error: ' + (e.message || e));
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initWhenReady);
    } else {
      initWhenReady();
    }
  </script>
</body>
</html>
