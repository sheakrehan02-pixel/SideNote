<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Side Note — Try the Prototype</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0e17;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      max-width: 800px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header h1 { font-size: 1.5rem; }
    .header a {
      color: #00d4aa;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .header a:hover { text-decoration: underline; }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary { background: #00d4aa; color: #0a0e17; }
    .btn-primary:hover { background: #00a884; }
    .btn-secondary { background: transparent; border: 1px solid #1e2733; color: #e6edf3; }
    .btn-secondary:hover { border-color: #8b949e; }
    .status {
      max-width: 800px;
      margin: 0 auto 16px;
      padding: 12px 16px;
      background: #131920;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #8b949e;
    }
    .status.active { color: #00d4aa; }
    #gazeDot {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #00d4aa;
      border: 3px solid rgba(0,212,170,0.5);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><img src="logo.svg" alt="" width="28" height="28" style="vertical-align: middle; margin-right: 8px;"> Side Note — Gaze Tracking Demo</h1>
    <a href="index.html">← Back to overview</a>
    <div class="controls">
      <button class="btn btn-primary" id="startBtn">Start tracking</button>
      <button class="btn btn-secondary" id="calibrateBtn" disabled>Calibrate</button>
      <button class="btn btn-secondary" id="stopBtn" disabled>Stop</button>
    </div>
  </div>
  <div class="status" id="status">Click "Start tracking" and allow camera access when prompted.</div>

  <div id="gazeDot"></div>

  <p style="max-width:800px;margin:0 auto;color:#8b949e;font-size:0.9rem;">
    After starting, look at the green dot — it follows your gaze. Click "Calibrate" and look at each point for better accuracy.
  </p>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const statusEl = document.getElementById('status');
    const gazeDot = document.getElementById('gazeDot');
    let tracking = false;

    function setStatus(msg, active) {
      statusEl.textContent = msg;
      statusEl.classList.toggle('active', !!active);
    }

    startBtn.onclick = function() {
      if (tracking) return;
      setStatus('Initializing camera...');
      webgazer.setGazeListener(function(data) {
        if (data && tracking) {
          gazeDot.style.display = 'block';
          gazeDot.style.left = data.x + 'px';
          gazeDot.style.top = data.y + 'px';
        }
      }).begin();
      webgazer.showVideoPreview(true);
      webgazer.showPredictionPoints(true);
      tracking = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      calibrateBtn.disabled = false;
      setStatus('Tracking active — the green dot follows your gaze. Try calibrating for better accuracy.', true);
    };

    stopBtn.onclick = function() {
      if (!tracking) return;
      webgazer.end();
      tracking = false;
      gazeDot.style.display = 'none';
      startBtn.disabled = false;
      stopBtn.disabled = true;
      calibrateBtn.disabled = true;
      setStatus('Stopped. Click "Start tracking" to try again.');
    };

    calibrateBtn.onclick = function() {
      if (!tracking) return;
      webgazer.showPredictionPoints(true);
      webgazer.setRegression('ridge');
      setStatus('Look at each prediction point as it appears...', true);
    };
  </script>
</body>
</html>
